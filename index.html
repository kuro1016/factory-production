<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产计件工资管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">

<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--line:#334155;--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;--accent:#f97316;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#facc15}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
.app{height:100vh;width:100vw;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:100}
.main{margin-left:220px;height:100vh;position:relative;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between}
.content{position:fixed;top:56px;left:220px;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:24px}
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;overflow:hidden}
.charts-grid>*{min-width:0;overflow:hidden}
.chart-box{height:320px;min-width:0;width:100%;overflow:hidden}
.logo{padding:20px;border-bottom:1px solid var(--line)}
.logo h1{font-size:18px;color:var(--accent)}
.logo p{font-size:11px;color:var(--txt3);margin-top:4px}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--txt2);cursor:pointer;border-left:3px solid transparent;font-size:14px}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:rgba(249,115,22,.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.side-foot{padding:16px;border-top:1px solid var(--line);font-size:11px;color:var(--txt3)}
.topbar-left h2{font-size:16px}
.topbar-right{color:var(--txt2);font-size:13px}
.today-pill{background:var(--bg3);padding:6px 14px;border-radius:20px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{opacity:.88}
.btn.secondary{background:var(--bg3);color:var(--txt)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}.kpi.yellow::before{background:var(--yellow)}
.kpi-label{font-size:12px;color:var(--txt2);margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700}
.kpi-value small{font-size:13px;color:var(--txt3);font-weight:400;margin-left:4px}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:6px}
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;overflow:hidden}
.charts-grid>*{min-width:0;overflow:hidden}
.chart-box{height:320px;min-width:0;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px 12px;text-align:left;font-weight:600;color:var(--txt2);font-size:12px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge.green{background:rgba(16,185,129,.15);color:var(--green)}
.badge.red{background:rgba(239,68,68,.15);color:var(--red)}
.badge.yellow{background:rgba(250,204,21,.15);color:var(--yellow)}
.badge.blue{background:rgba(59,130,246,.15);color:var(--blue)}
.entry-row{display:grid;grid-template-columns:130px 1fr 1fr 1fr 90px 90px 90px 140px 32px;gap:8px;align-items:center;margin-bottom:8px}
.entry-row.head{font-size:12px;color:var(--txt2);font-weight:600}
.entry-row input,.entry-row select{width:100%;padding:8px 10px;font-size:13px}
.row-del{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px}
.tip{background:rgba(59,130,246,.1);border-left:3px solid var(--blue);padding:10px 14px;border-radius:4px;font-size:12px;color:var(--txt2);margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--txt3)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{margin-bottom:18px;font-size:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:12px 20px;border-radius:6px;z-index:200;display:none;font-size:13px}
.toast.error{background:var(--red)}
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.paysheet th{position:sticky;top:0;z-index:2}
.paysheet .emp-col{position:sticky;left:0;background:var(--bg2);z-index:1}
.paysheet th.emp-col{left:0;z-index:3;background:var(--bg3)}
.paysheet td{font-size:12px;padding:6px 8px}
.paysheet .day-cell{text-align:right;min-width:58px}
.paysheet .sum-col{background:rgba(249,115,22,.08);font-weight:700;color:var(--accent)}
.paysheet .total-col{background:rgba(16,185,129,.1);font-weight:700;color:var(--green)}
.paysheet input.time-wage{width:90px;background:var(--bg);border:1px solid var(--yellow);color:var(--yellow);text-align:right;padding:4px 6px;font-size:12px;font-weight:600}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.entry-row{grid-template-columns:1fr 1fr}}
@media print{.sidebar,.topbar,.side-foot,.no-print{display:none!important}.main{margin:0}body{background:#fff;color:#000}.card{border:1px solid #ccc}th{background:#eee!important;color:#000!important}}
</style>
</head>

const ADMIN_PASS = '123456';

}

$('#setupForm').style.display='none';

// ==== 云端工具 ====

function tsNow(){return new Date().toISOString()}
function setCloud(t){const el=document.getElementById('cloudStatus');if(el)el.textContent=t}
function modalOpen(){return $('#modalMask').classList.contains('show')}
/* 读取云端整行 */
async function cloudGet(){
  const r=await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?key=eq.main&select=data,updated_at`,{
    headers:{apikey:CLOUD.key,Authorization:`Bearer ${CLOUD.key}`}});
  const rows=await r.json();
  if(rows&&rows.length)return{data:rows[0].data,rev:rows[0].updated_at};

/* 条件更新：仅当云端 updated_at 仍等于 rev（乐观锁，防并发覆盖），返回更新行，空数组=冲突 */
async function cloudPush(data,rev){
  const url=rev
    ?`${CLOUD.url}/rest/v1/${CLOUD.table}?key=eq.main&updated_at=eq.${encodeURIComponent(rev)}`
    :`${CLOUD.url}/rest/v1/${CLOUD.table}?key=eq.main`;
  const r=await fetch(url,{method:'PATCH',
    headers:{apikey:CLOUD.key,Authorization:`Bearer ${CLOUD.key}`,'Content-Type':'application/json'},
    body:JSON.stringify({data,updated_at:tsNow()})});
  const txt=await r.text();let rows=[];try{rows=txt?JSON.parse(txt):[]}catch(e){}
  return rows;
}
/* 首次插入整行 */
async function cloudInsert(data){
  await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}`,{method:'POST',
    headers:{apikey:CLOUD.key,Authorization:`Bearer ${CLOUD.key}`,'Content-Type':'application/json',Prefer:'return=minimal'},

}
/* 智能合并两份数据：新增取并集，修改按 updated_at 新者为准，删除按墓碑同步 */
function mergeDB(L,C){
  L=L||{};C=C||{};const out={};
  const arrs=['employees','products','records','materials'];
  arrs.forEach(k=>{
    const map=new Map();
    (C[k]||[]).forEach(x=>map.set(String(x.id),x));
    (L[k]||[]).forEach(x=>{
      const key=String(x.id),ex=map.get(key);
      if(!ex){map.set(key,x)}else{
        const lt=x.updated_at?Date.parse(x.updated_at):0,ct=ex.updated_at?Date.parse(ex.updated_at):0;
        if(lt>=ct)map.set(key,x);
      }
    });
    out[k]=[...map.values()];
  });
  // 计时工资：按 _timeMeta 时间戳决定新值
  const tw={},twm={},Lm=L._timeMeta||{},Cm=C._timeMeta||{};
  const keys=new Set([...Object.keys(L.timeWages||{}),...Object.keys(C.timeWages||{})]);
  keys.forEach(key=>{
    const lv=(L.timeWages||{})[key],cv=(C.timeWages||{})[key];
    const lt=Lm[key]?Date.parse(Lm[key]):0,ct=Cm[key]?Date.parse(Cm[key]):0;
    if(lv===undefined){tw[key]=cv;if(Cm[key])twm[key]=Cm[key]}
    else if(cv===undefined){tw[key]=lv;if(Lm[key])twm[key]=Lm[key]}
    else if(lt>=ct){tw[key]=lv;if(Lm[key])twm[key]=Lm[key]}
    else{tw[key]=cv;if(Cm[key])twm[key]=Cm[key]}
  });
  out.timeWages=tw;out._timeMeta=twm;
  // 墓碑（删除清单）合并，清理30天前
  const tomb={};
  Object.entries(L._tomb||{}).forEach(([id,t])=>tomb[id]=t);
  Object.entries(C._tomb||{}).forEach(([id,t])=>{if(!tomb[id]||Date.parse(t)>Date.parse(tomb[id]))tomb[id]=t});
  const cutoff=Date.now()-30*86400000;
  Object.keys(tomb).forEach(id=>{if(Date.parse(tomb[id])<cutoff)delete tomb[id]});
  out._tomb=tomb;
  arrs.forEach(k=>{out[k]=out[k].filter(x=>!tomb[k+':'+String(x.id)])});
  return out;
}
function markDeleted(kind,id){DB._tomb=DB._tomb||{};DB._tomb[kind+':'+String(id)]=tsNow()}

}

}

/* 保存：读云端→合并→乐观锁写回，冲突自动重试3次，杜绝多人覆盖 */
async function save(){
  localStorage.setItem(LS_KEY,JSON.stringify(DB));
  if(!useCloud())return;
  isDirty=true;
  try{
    let pushed=false;
    for(let attempt=0;attempt<3&&!pushed;attempt++){
      const {data:cloud,rev}=await cloudGet();
      DB=cloud?mergeDB(DB,cloud):DB;
      localStorage.setItem(LS_KEY,JSON.stringify(DB));
      if(!cloud){await cloudInsert(DB);pushed=true;break}
      const rows=await cloudPush(DB,rev);
      if(rows.length>=1)pushed=true;
    }
    if(pushed){isDirty=false;setCloud('☁️ 已同步 · '+new Date().toLocaleTimeString())}
    else setCloud('⚠️ 同步冲突，将自动重试');
  }catch(e){setCloud('⚠️ 同步失败，已存本地，将自动重试')}
}
/* 定时同步：有未保存数据则走保存，否则只拉取；每30秒 */
async function pullOnly(){
  if(!useCloud())return;
  try{
    const {data:cloud}=await cloudGet();
    if(cloud){
      DB=mergeDB(DB,cloud);
      localStorage.setItem(LS_KEY,JSON.stringify(DB));
      if(curView!=='entry'&&!modalOpen())render();
      setCloud('☁️ 已连接云端 · '+new Date().toLocaleTimeString());
    }
  }catch(e){}
}
function startSync(){
  if(syncTimer||!useCloud())return;
  syncTimer=setInterval(()=>{if(isDirty)save();else pullOnly();},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){isDirty?save():pullOnly()}});
}

function getFilteredRecords(){

    c=ws.getCell(3,1);c.value='部门：生产车间';c.font={name:'微软雅黑',size:10};c.alignment={horizontal:'left',vertical:'middle'};
    ws.mergeCells(3,9,3,20);
    c=ws.getCell(3,9);c.value=ym.replace('-',' 年 ')+' 月份';c.font={name:'微软雅黑',size:10,bold:true,color:{argb:NAVY}};c.alignment={horizontal:'center',vertical:'middle'};
    ws.mergeCells(3,21,3,LAST_COL+5);
    c=ws.getCell(3,21);c.value='单位：元';c.font={name:'微软雅黑',size:9,color:{argb:GRAY}};c.alignment={horizontal:'right',vertical:'middle'};
    ws.getRow(3).height=22;

    // 第4-5行：表头
    ws.mergeCells(4,1,5,1);ws.getCell(4,1).value='序号';
    ws.mergeCells(4,2,5,2);ws.getCell(4,2).value='姓名';
    for(let d=1;d<=dim;d++)ws.mergeCells(4,2+d,5,2+d),ws.getCell(4,2+d).value=d;
    ws.mergeCells(4,dim+3,5,dim+3);ws.getCell(4,dim+3).value='计件合计';
    ws.mergeCells(4,dim+4,5,dim+4);ws.getCell(4,dim+4).value='计时合计';
    ws.mergeCells(4,dim+5,5,dim+5);ws.getCell(4,dim+5).value='应发工资';
    ws.mergeCells(4,dim+6,5,dim+6);ws.getCell(4,dim+6).value='备注';
    for(let col=1;col<=LAST_COL+5;col++){
      for(let row=4;row<=5;row++){
        c=ws.getCell(row,col);
        c.font={name:'微软雅黑',size:10,bold:true,color:{argb:WHITE}};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY2}};
        c.alignment={horizontal:'center',vertical:'middle',wrapText:true};
        c.border=allBorder;
      }
    }
    ws.getRow(4).height=24;ws.getRow(5).height=20;

    // 数据行
    let r=6;let allPiece=0,allOt=0,allAmount=0;
    DB.employees.forEach((e,ei)=>{
      const rs=records.filter(x=>x.empId===e.id);
      const bg=ei%2===0?LIGHT:WHITE;
      // 合并序号、姓名、备注
      ws.mergeCells(r,1,r+1,1);ws.getCell(r,1).value=ei+1;
      ws.mergeCells(r,2,r+1,2);ws.getCell(r,2).value=e.name;
      ws.mergeCells(r,dim+6,r+1,dim+6);
      let pieceTotal=0,noteStr='';
      for(let d=1;d<=dim;d++){
        const ds=ms.slice(0,8)+String(d).padStart(2,'0');
        const dayRs=rs.filter(x=>x.date===ds);
        const p=dayRs.reduce((s,x)=>s+wageOf(x),0);
        const note=dayRs.map(x=>x.note).filter(Boolean).join(';');
        const cell1=ws.getCell(r,2+d),cell2=ws.getCell(r+1,2+d);
        if(p>0){cell1.value=+p.toFixed(2);cell1.numFmt='0.00';pieceTotal+=p;}
        else if(note){cell1.value=note;cell1.font={name:'微软雅黑',size:9,italic:true,color:{argb:GRAY}};noteStr=note;}
        cell1.alignment={horizontal:p>0?'right':'center',vertical:'middle'};
        cell2.alignment={horizontal:'right',vertical:'middle'};
        cell1.border=allBorder;cell2.border=allBorder;
        cell1.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
        cell2.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
        if(!cell1.font)cell1.font={name:'微软雅黑',size:10};
        cell2.font={name:'微软雅黑',size:9,color:{argb:GRAY}};
      }
      const time=DB.timeWages[ym+'_'+e.id]||0;
      const total=pieceTotal+time;
      allPiece+=pieceTotal;allOt+=time;allAmount+=total;
      // 三列合计
      const ah=ws.getCell(r,dim+3);ah.value=+pieceTotal.toFixed(2);ah.numFmt='0.00';
      const ai=ws.getCell(r,dim+4);ai.value=+time.toFixed(2);ai.numFmt='0.00';
      const aj=ws.getCell(r,dim+5);aj.value=+total.toFixed(2);aj.numFmt='¥#,##0.00';
      ws.getCell(r,dim+6).value=noteStr;
      // 样式
      for(let col=1;col<=LAST_COL+5;col++){
        for(let row=r;row<=r+1;row++){
          c=ws.getCell(row,col);
          c.border=allBorder;
          c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
          if(col<=2){c.alignment={horizontal:'center',vertical:'middle'};c.font={name:'微软雅黑',size:10,bold:col===2};}
          else if(col===dim+6){c.font={name:'微软雅黑',size:9,color:{argb:GRAY}};c.alignment={horizontal:'left',vertical:'middle',wrapText:true};}
        }
      }
      ah.font={name:'微软雅黑',size:10,bold:true,color:{argb:NAVY}};
      ai.font={name:'微软雅黑',size:10,color:{argb:GRAY}};
      aj.font={name:'微软雅黑',size:11,bold:true,color:{argb:GREEN}};
      ah.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDF2F7'}};
      ai.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDF2F7'}};
      aj.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDF2F7'}};
      ws.getRow(r).height=20;ws.getRow(r+1).height=18;
      r+=2;
    });

    // 合计行
    ws.mergeCells(r,1,r,2);
    c=ws.getCell(r,1);c.value='合 计';
    for(let d=1;d<=dim;d++){
      const ds=ms.slice(0,8)+String(d).padStart(2,'0');
      let tp=0;records.filter(x=>x.date===ds).forEach(x=>tp+=wageOf(x));
      if(tp>0){const cc=ws.getCell(r,2+d);cc.value=+tp.toFixed(2);cc.numFmt='0.00';cc.alignment={horizontal:'right',vertical:'middle'};}
    }
    ws.getCell(r,dim+3).value=+allPiece.toFixed(2);
    ws.getCell(r,dim+4).value=+allOt.toFixed(2);
    ws.getCell(r,dim+5).value=+allAmount.toFixed(2);
    ws.getCell(r,dim+5).numFmt='¥#,##0.00';
    for(let col=1;col<=LAST_COL+5;col++){
      c=ws.getCell(r,col);
      c.font={name:'微软雅黑',size:11,bold:true,color:{argb:WHITE}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
      c.alignment={horizontal:col<=2?'center':'right',vertical:'middle'};
      c.border={top:{style:'medium',color:{argb:NAVY}},bottom:{style:'medium',color:{argb:NAVY}},left:thinBorder,right:thinBorder};
    }
    ws.getRow(r).height=28;
    r+=2;

    // 签字行
    ws.mergeCells(r,1,r,12);ws.getCell(r,1).value='审核签字：';
    ws.mergeCells(r,14,r,25);ws.getCell(r,14).value='制表签字：';
    ws.mergeCells(r,27,r,LAST_COL+5);ws.getCell(r,27).value='发放日期：    年   月   日';
    for(let col=1;col<=LAST_COL+5;col++){
      c=ws.getCell(r,col);c.font={name:'微软雅黑',size:10};c.alignment={vertical:'middle'};
    }
    ws.getRow(r).height=30;

    // 打印设置
    ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.5,right:0.5,top:0.7,bottom:0.7}};

    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工资表_${ym}.xlsx`;a.click();
    toast('已导出专业版工资表');
  }catch(err){
    console.error(err);
    toast('导出失败: '+err.message,true);
  }
}

/* ==== 物料 ==== */
function renderMaterials(c){
  c.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="card-title">登记物料领用</div>
    <div class="form-row grid-4"><div><label>日期</label><input type="date" id="matDate" value="${today()}"></div><div><label>物料名称</label><input id="matName" placeholder="PVC卷材/气嘴"></div><div><label>规格</label><input id="matSpec"></div><div><label>单位</label><input id="matUnit"></div></div>
    <div class="form-row grid-4"><div><label>用量</label><input type="number" id="matQty" min="0" value="0"></div><div><label>单价</label><input type="number" id="matPrice" min="0" step="0.001" value="0"></div><div><label>领用人</label><input id="matPerson"></div><div><label style="visibility:hidden">.</label><button class="btn" onclick="saveMaterial()">保存</button></div></div></div>
  <div class="card" style="padding:0;overflow:auto;max-height:60vh"><table><thead><tr><th>日期</th><th>物料</th><th>规格</th><th>单位</th><th class="num">用量</th><th class="num">单价</th><th class="num">金额</th><th>领用人</th><th></th></tr></thead><tbody id="matBody"></tbody></table></div>`;
  updateMatTable();
}
function updateMatTable(){$('#matBody').innerHTML=DB.materials.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<tr><td>${m.date}</td><td>${m.name}</td><td>${m.spec||''}</td><td>${m.unit||''}</td><td class="num">${m.qty}</td><td class="num">${fmtPrice(m.price)}</td><td class="num" style="color:var(--accent);font-weight:600">¥${((+m.qty)*(+m.price)).toFixed(2)}</td><td>${m.person||''}</td><td><button class="btn sm danger" onclick="delMaterial(${m.id})">删</button></td></tr>`).join('')}
function saveMaterial(){const n=$('#matName').value.trim();if(!n){toast('请填物料名',true);return}DB.materials.push({id:nextId(),date:$('#matDate').value,name:n,spec:$('#matSpec').value,unit:$('#matUnit').value,qty:+$('#matQty').value||0,price:+$('#matPrice').value||0,person:$('#matPerson').value,updated_at:tsNow()});save();toast('已登记');['matName','matSpec','matUnit','matPerson'].forEach(id=>$('#'+id).value='');$('#matQty').value=0;$('#matPrice').value=0;updateMatTable()}
function delMaterial(id){markDeleted('materials',id);DB.materials=DB.materials.filter(m=>m.id!==id);save();updateMatTable();toast('已删除')}

/* ==== 员工 ==== */
function renderEmployees(c){
  c.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="card-title">新增员工<div style="display:flex;gap:8px"><button class="btn sm secondary" onclick="openBulkImport('employees')">批量导入</button><button class="btn sm" onclick="saveEmp()">保存</button></div></div>
    <div class="form-row grid-4"><div><label>工号</label><input id="neId" placeholder="E011"></div><div><label>姓名</label><input id="neName"></div><div><label>班组</label><select id="neTeam"><option>一班</option><option>二班</option><option>三班</option></select></div><div><label>岗位</label><input id="neRole"></div></div></div>
  <div class="card" style="padding:0"><table><thead><tr><th>工号</th><th>姓名</th><th>班组</th><th>岗位</th><th class="num">本月工资</th><th class="num">本月产量</th><th></th></tr></thead><tbody>${DB.employees.map(e=>{const ms=new Date();ms.setDate(1);const mss=ms.toISOString().slice(0,10);const rs=DB.records.filter(r=>r.empId===e.id&&r.date>=mss);const w=rs.reduce((s,r)=>s+wageOf(r),0),q=rs.reduce((s,r)=>s+(r.qtyGood||0),0);return`<tr><td>${e.id}</td><td style="font-weight:600">${e.name}</td><td><span class="badge blue">${e.team}</span></td><td>${e.role}</td><td class="num" style="color:var(--accent);font-weight:600">${fmtMoney(w)}</td><td class="num">${q}</td><td style="white-space:nowrap"><button class="btn sm secondary" onclick="editEmp('${e.id}')" style="margin-right:4px">改</button><button class="btn sm danger" onclick="delEmp('${e.id}')">删</button></td></tr>`}).join('')}</tbody></table></div>`;
}
function editEmp(id){
  const e=DB.employees.find(x=>x.id===id);if(!e)return;
  modal(`<h3>编辑员工 ${e.name}</h3>
    <div class="form-row grid-2"><div><label>工号</label><input id="eeId" value="${e.id}"></div><div><label>姓名</label><input id="eeName" value="${e.name}"></div></div>
    <div class="form-row grid-2"><div><label>班组</label><select id="eeTeam"><option ${e.team==='一班'?'selected':''}>一班</option><option ${e.team==='二班'?'selected':''}>二班</option><option ${e.team==='三班'?'selected':''}>三班</option></select></div><div><label>岗位</label><input id="eeRole" value="${e.role||''}"></div></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="saveEmpEdit('${id}')">保存</button></div>`);
}
function saveEmpEdit(id){
  const e=DB.employees.find(x=>x.id===id);if(!e)return;
  const nid=$('#eeId').value.trim(),nname=$('#eeName').value.trim();
  if(!nid||!nname){toast('工号姓名必填',true);return}
  if(nid!==id&&DB.employees.find(x=>x.id===nid)){toast('工号已存在',true);return}
  // 同步更新所有历史记录的empId
  if(nid!==id)DB.records.forEach(r=>{if(r.empId===id)r.empId=nid});
  e.id=nid;e.name=nname;e.team=$('#eeTeam').value;e.role=$('#eeRole').value;e.updated_at=tsNow();
  save();closeModal();toast('已保存');render();
}
function saveEmp(){const id=$('#neId').value.trim(),name=$('#neName').value.trim();if(!id||!name){toast('工号姓名必填',true);return}if(DB.employees.find(e=>e.id===id)){toast('工号已存在',true);return}DB.employees.push({id,name,team:$('#neTeam').value,role:$('#neRole').value,updated_at:tsNow()});save();toast('已添加');render()}
function delEmp(id){if(!confirm('删除员工？'))return;markDeleted('employees',id);DB.employees=DB.employees.filter(e=>e.id!==id);save();render();toast('已删除')}

/* ==== 产品工价 ==== */
function renderProducts(c){
  c.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="card-title">工价管理<div style="display:flex;gap:8px"><input type="text" id="prodKw" placeholder="搜索产品/工序..." style="width:180px"><button class="btn sm secondary" onclick="openBulkImport('products')">批量导入</button><button class="btn sm" onclick="openProductModal()">+ 添加</button></div></div></div>
  <div class="card" style="padding:0;overflow:auto;max-height:70vh"><table><thead><tr><th>产品型号</th><th>款式</th><th>工序</th><th class="num">单件工价</th><th></th></tr></thead><tbody id="prodBody"></tbody></table></div>`;
  $('#prodKw').addEventListener('input',renderProdTable);
  renderProdTable();
}
function renderProdTable(){
  const k=($('#prodKw').value||'').trim().toLowerCase();
  const list=DB.products.filter(p=>!k||(p.model+p.style+p.process).toLowerCase().includes(k));
  $('#prodBody').innerHTML=list.map(p=>`<tr><td>${p.model}</td><td>${p.style}</td><td>${p.process}</td><td class="num" style="color:var(--accent);font-weight:600">${fmtPrice(p.price)}</td><td style="white-space:nowrap"><button class="btn sm secondary" onclick="editProduct(${p.id})" style="margin-right:4px">改</button><button class="btn sm danger" onclick="delProduct(${p.id})">删</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">无匹配</td></tr>';
}
function editProduct(id){
  const p=DB.products.find(x=>x.id===id);if(!p)return;
  modal(`<h3>编辑工价</h3><div class="form-row"><label>产品型号</label><input id="epModel" value="${p.model}"></div><div class="form-row grid-3"><div><label>款式</label><input id="epStyle" value="${p.style}"></div><div><label>工序</label><input id="epProcess" value="${p.process}"></div><div><label>工价</label><input type="number" id="epPrice" step="0.001" min="0" value="${p.price}"></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="saveProductEdit(${id})">保存</button></div>`);
}
function saveProductEdit(id){
  const p=DB.products.find(x=>x.id===id);if(!p)return;
  p.model=$('#epModel').value.trim();p.style=$('#epStyle').value.trim();p.process=$('#epProcess').value.trim();p.price=+$('#epPrice').value||0;
  p.updated_at=tsNow();
  save();closeModal();toast('已保存');render();
}
function openProductModal(){modal(`<h3>新增工价</h3><div class="form-row"><label>产品型号</label><input id="npModel"></div><div class="form-row grid-3"><div><label>款式</label><input id="npStyle"></div><div><label>工序</label><input id="npProcess"></div><div><label>工价</label><input type="number" id="npPrice" step="0.001" min="0" value="0"></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="saveProduct()">保存</button></div>`)}
function saveProduct(){const m=$('#npModel').value.trim(),s=$('#npStyle').value.trim(),p=$('#npProcess').value.trim(),pr=+$('#npPrice').value||0;if(!m||!s||!p){toast('请填完整',true);return}DB.products.push({id:nextId(),model:m,style:s,process:p,price:pr,updated_at:tsNow()});save();closeModal();toast('已保存');render()}
function delProduct(id){if(!confirm('删除？'))return;markDeleted('products',id);DB.products=DB.products.filter(p=>p.id!==id);save();render();toast('已删除')}

/* ==== 批量导入 ==== */
const IMPORT_TPL={
  employees:{title:'批量导入员工',hint:'从Excel选4列（工号、姓名、班组、岗位）Ctrl+C粘贴',parse:p=>{const id=(p[0]||'').trim(),name=(p[1]||'').trim();if(!id||!name)return null;return{id,name,team:(p[2]||'一班').trim(),role:(p[3]||'').trim()}},commit:l=>{let n=0;l.forEach(o=>{if(!DB.employees.find(e=>e.id===o.id)){DB.employees.push(o);n++}});return n}},
  products:{title:'批量导入工价',hint:'从Excel选4列（产品、款式、工序、工价）粘贴',parse:p=>{const m=(p[0]||'').trim(),s=(p[1]||'').trim(),pr=(p[2]||'').trim(),price=parseFloat(p[3]);if(!m||!s||!pr||isNaN(price))return null;return{model:m,style:s,process:pr,price}},commit:l=>{let n=0;l.forEach(o=>{if(!DB.products.find(x=>x.model===o.model&&x.style===o.style&&x.process===o.process)){DB.products.push({id:nextId(),...o,updated_at:tsNow()});n++}});return n}},
  records:{title:'批量导入历史记录',hint:'7列：日期、工号、产品、款式、工序、合格数、不良数',parse:p=>{const d=(p[0]||'').trim(),id=(p[1]||'').trim(),m=(p[2]||'').trim(),s=(p[3]||'').trim(),pr=(p[4]||'').trim(),g=parseInt(p[5])||0,b=parseInt(p[6])||0;if(!d||!id||!m||!pr)return null;return{date:d,empId:id,model:m,style:s,process:pr,qtyGood:g,qtyBad:b,note:''}},commit:l=>{let n=0;l.forEach(o=>{DB.records.push({id:nextId(),...o,updated_at:tsNow()});n++});return n}}
};
function openBulkImport(type){const cfg=IMPORT_TPL[type];modal(`<h3>${cfg.title}</h3><div class="tip">${cfg.hint}</div><label>粘贴区域：</label><textarea id="bulkText" rows="8" style="width:100%;font-family:monospace;font-size:12px"></textarea><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="doBulkImport('${type}')">解析并导入</button></div>`)}
function doBulkImport(type){const cfg=IMPORT_TPL[type];const text=$('#bulkText').value.trim();if(!text){toast('请先粘贴',true);return}const lines=text.split(/\r?\n/).filter(l=>l.trim());const list=[];let skip=0;lines.forEach((line,i)=>{const parts=line.split(/\t|,|，/);if(i===0&&/工号|姓名|产品|日期/.test(parts[0]))return;const o=cfg.parse(parts);if(o)list.push(o);else skip++});if(!list.length){toast('无有效数据',true);return}const n=cfg.commit(list);save();closeModal();toast(`导入 ${n} 条${skip?`，跳过 ${skip}`:''}`);render()}

load();$('#todayPill').textContent='今天：'+today();navigate('dashboard');
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c.resize()));
// 回车登录
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('#loginPage').style.display!=='none'){
    if($('#loginForm').style.display!=='none')doLogin();else doSetup();
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();toast('已自动保存')}
});
