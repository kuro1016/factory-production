<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产计件工资管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--line:#334155;--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;--accent:#f97316;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#facc15}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
.app{height:100vh;width:100vw;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:100}
.main{margin-left:220px;height:100vh;position:relative;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between}
.content{position:fixed;top:56px;left:220px;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:24px}
.logo{padding:20px;border-bottom:1px solid var(--line)}
.logo h1{font-size:18px;color:var(--accent)}
.logo p{font-size:11px;color:var(--txt3);margin-top:4px}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--txt2);cursor:pointer;border-left:3px solid transparent;font-size:14px}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:rgba(249,115,22,.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.side-foot{padding:16px;border-top:1px solid var(--line);font-size:11px;color:var(--txt3)}
.topbar-left h2{font-size:16px}
.topbar-right{color:var(--txt2);font-size:13px;display:flex;align-items:center;gap:12px}
.today-pill{background:var(--bg3);padding:6px 14px;border-radius:20px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{opacity:.88}
.btn.secondary{background:var(--bg3);color:var(--txt)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}.kpi.yellow::before{background:var(--yellow)}
.kpi-label{font-size:12px;color:var(--txt2);margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700}
.kpi-value small{font-size:13px;color:var(--txt3);font-weight:400;margin-left:4px}
.kpi-sub{font-size:11px;color:var(--txt3);margin-top:6px}
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.charts-grid>*{min-width:0}
.chart-box{height:320px;min-width:0;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:10px 12px;text-align:left;font-weight:600;color:var(--txt2);font-size:12px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge.green{background:rgba(16,185,129,.15);color:var(--green)}
.badge.red{background:rgba(239,68,68,.15);color:var(--red)}
.badge.yellow{background:rgba(250,204,21,.15);color:var(--yellow)}
.badge.blue{background:rgba(59,130,246,.15);color:var(--blue)}
.entry-row{display:grid;grid-template-columns:130px 1fr 1fr 1fr 90px 90px 90px 140px 32px;gap:8px;align-items:center;margin-bottom:8px}
.entry-row.head{font-size:12px;color:var(--txt2);font-weight:600}
.entry-row input,.entry-row select{width:100%;padding:8px 10px;font-size:13px}
.row-del{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:4px}
.tip{background:rgba(59,130,246,.1);border-left:3px solid var(--blue);padding:10px 14px;border-radius:4px;font-size:12px;color:var(--txt2);margin-bottom:14px}
.empty{text-align:center;padding:40px;color:var(--txt3)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.modal-mask.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{margin-bottom:18px;font-size:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:12px 20px;border-radius:6px;z-index:400;display:none;font-size:13px}
.toast.error{background:var(--red)}
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.paysheet th{position:sticky;top:0;z-index:2}
.paysheet .emp-col{position:sticky;left:0;background:var(--bg2);z-index:1}
.paysheet th.emp-col{left:0;z-index:3;background:var(--bg3)}
.paysheet td{font-size:12px;padding:6px 8px}
.paysheet .day-cell{text-align:right;min-width:58px}
.paysheet .sum-col{background:rgba(249,115,22,.08);font-weight:700;color:var(--accent)}
.paysheet .total-col{background:rgba(16,185,129,.1);font-weight:700;color:var(--green)}
.paysheet input.time-wage{width:90px;background:var(--bg);border:1px solid var(--yellow);color:var(--yellow);text-align:right;padding:4px 6px;font-size:12px;font-weight:600}
.admin-only{display:none}
body.role-admin .admin-only{display:block}
body.role-admin .nav-item.admin-only{display:flex}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.entry-row{grid-template-columns:1fr 1fr}}
@media print{.sidebar,.topbar,.side-foot,.no-print{display:none!important}.main{margin:0}body{background:#fff;color:#000}.card{border:1px solid #ccc}th{background:#eee!important;color:#000!important}}
</style>
</head>
<body>
<!-- 登录页 -->
<div id="loginPage" style="position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);display:flex;align-items:center;justify-content:center;z-index:999">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:48px;margin-bottom:12px">🏭</div>
      <h1 style="font-size:20px;color:#f1f5f9;margin-bottom:6px">生产计件工资管理系统</h1>
      <p style="font-size:12px;color:#64748b">请登录后使用</p>
    </div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div style="margin-bottom:14px"><label style="color:#94a3b8;font-size:12px;display:block;margin-bottom:6px">用户名</label><input id="loginUser" placeholder="admin" autocomplete="username" style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:11px 14px;border-radius:8px;font-size:14px"></div>
      <div style="margin-bottom:20px"><label style="color:#94a3b8;font-size:12px;display:block;margin-bottom:6px">密码</label><input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password" style="width:100%;background:#0f172a;border:1px solid #334155;color:#f1f5f9;padding:11px 14px;border-radius:8px;font-size:14px"></div>
      <button type="submit" id="loginBtn" style="width:100%;background:#f97316;color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">登 录</button>
      <p id="loginErr" style="color:#ef4444;font-size:12px;text-align:center;margin-top:12px;display:none"></p>
    </form>
  </div>
</div>
<div class="app" id="appRoot" style="display:none">
  <div class="sidebar">
    <div class="logo"><h1>🏭 生产管理系统</h1><p>计件工资 · 云端版 v2.0</p></div>
    <div class="nav" id="nav">
      <div class="nav-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>生产仪表盘</div>
      <div class="nav-item" data-view="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>生产录入</div>
      <div class="nav-item" data-view="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>生产记录</div>
      <div class="nav-item admin-only" data-view="payroll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>工资汇总</div>
      <div class="nav-item admin-only" data-view="paysheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>工资表</div>
      <div class="nav-item" data-view="materials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>物料用量</div>
      <div class="nav-item" data-view="employees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>员工管理</div>
      <div class="nav-item" data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>产品工价</div>
    </div>
    <div class="side-foot">
      <button class="btn secondary sm admin-only" style="width:100%;margin-bottom:8px" onclick="exportData()">导出备份</button>
      <button class="btn secondary sm admin-only" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">导入备份</button>
      <button class="btn danger sm admin-only" style="width:100%;margin-bottom:8px" onclick="clearAllData()">清空所有数据</button>
      <button class="btn secondary sm" style="width:100%;margin-bottom:8px" onclick="changePwd()">修改密码</button>
      <button class="btn secondary sm" style="width:100%" onclick="logout()">退出登录</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
  <div class="main">
    <div class="topbar"><div class="topbar-left"><h2 id="viewTitle">生产仪表盘</h2></div><div class="topbar-right"><span id="cloudStatus" style="color:var(--txt3);font-size:12px"></span><span class="today-pill" id="todayPill"></span></div></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CDN 双源加载（jsDelivr 故障自动切换 cdnjs）===== */
const LIBS=[
 {js:'@supabase/supabase-js@2.45.4/dist/umd/supabase.js', cdnjs:'supabase-js/2.45.4/supabase.js', check:()=>window.supabase},
 {js:'echarts@5.4.3/dist/echarts.min.js', cdnjs:'echarts/5.4.3/echarts.min.js', check:()=>window.echarts},
 {js:'exceljs@4.4.0/dist/exceljs.min.js', cdnjs:'exceljs/4.4.0/exceljs.min.js', check:()=>window.ExcelJS}
];
function loadSrc(src){return new Promise((res,rej)=>{var s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('fail '+src));document.head.appendChild(s)})}
async function loadAll(){
 for(const L of LIBS){
   if(L.check())continue;
   try{await loadSrc('https://cdn.jsdelivr.net/npm/'+L.js)}
   catch(e){await loadSrc('https://cdnjs.cloudflare.com/ajax/libs/'+L.cdnjs)}
 }
 boot();
}
/* ===== APP SCRIPT ===== */
/* ---- 云端配置 ---- */
const SB_URL='https://eboongrwkmsysbztyxgm.supabase.co';
const SB_KEY='sb_publishable_EJUPSm5-kzQ0p7Kl1N3gFw_te8P3V-S';
const EMAIL_DOMAIN='@jiayu.factory';
let sb=null;
let me=null,isAdmin=false,dataReady=false;
let DB={employees:[],products:[],records:[],materials:[],timeWages:{}};

/* ---- DOM 工具 ---- */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
/* XSS 防护：所有用户可控内容渲染前转义 */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---- 本地时区日期（修复 UTC 错一天 bug）---- */
const pad2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function localDateStr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return localDateStr(d)}
function monthStart(s){return s.slice(0,7)+'-01'}
function monthEnd(s){const y=+s.slice(0,4),m=+s.slice(5,7);return s.slice(0,7)+'-'+pad2(new Date(y,m,0).getDate())}

/* ---- 工资/工价（工价精确不四舍五入，仅金额显示两位）---- */
function priceOf(model,style,process){const p=DB.products.find(x=>x.model===model&&x.style===style&&x.process===process);return p?p.price:0}
function wageOf(r){return (r.qtyGood||0)*priceOf(r.model,r.style,r.process)}
function fmtMoney(n){return Number(n).toFixed(2)}
function fmtPrice(n){return String(Number(n))}
function empName(id){const e=DB.employees.find(x=>x.id===id);return e?e.name:id}

/* ---- 提示 / 弹窗 ---- */
let toastTimer;
function toast(msg,isErr){const t=$('#toast');t.textContent=msg;t.className=isErr?'toast error':'toast';t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2200)}
function modal(html){$('#modalBox').innerHTML=html;$('#modalMask').classList.add('show')}
function closeModal(){$('#modalMask').classList.remove('show')}
function modalOpen(){return $('#modalMask').classList.contains('show')}
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});

/* ---- 审计日志（不可篡改）---- */
async function audit(action,target,detail){
 try{await sb.from('audit_log').insert({actor:me?me.id:null,actor_name:me?me.userName:'',action,target,detail:detail||null})}catch(e){}
}

/* ---- 认证（真实账号，服务端校验，无法绕过）---- */
function loginEmail(u){u=u.trim();return u.includes('@')?u:u+EMAIL_DOMAIN}
function roleOf(user){return(user.app_metadata&&user.app_metadata.role)||''}
function showLoginErr(m){const el=$('#loginErr');el.textContent=m;el.style.display='block';$('#loginPass').value='';$('#loginPass').focus()}
async function doLogin(e){
 if(e)e.preventDefault();
 const u=$('#loginUser').value.trim(),p=$('#loginPass').value;
 if(!u||!p){showLoginErr('请输入用户名和密码');return false}
 const btn=$('#loginBtn');btn.disabled=true;btn.textContent='登录中...';
 const {data,error}=await sb.auth.signInWithPassword({email:loginEmail(u),password:p});
 btn.disabled=false;btn.textContent='登 录';
 if(error){showLoginErr('用户名或密码错误');return false}
 await afterAuth(data.session);
 return false;
}
async function logout(){await sb.auth.signOut()}
function changePwd(){
 modal(`<h3>修改密码</h3>
  <div class="form-row"><label>当前密码</label><input type="password" id="cpOld" autocomplete="current-password"></div>
  <div class="form-row"><label>新密码（至少6位）</label><input type="password" id="cpNew" autocomplete="new-password"></div>
  <div class="form-row"><label>确认新密码</label><input type="password" id="cpNew2" autocomplete="new-password"></div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="doChangePwd()">确认修改</button></div>`);
}
async function doChangePwd(){
 const o=$('#cpOld').value,n=$('#cpNew').value,n2=$('#cpNew2').value;
 if(!o||!n){toast('请填写完整',true);return}
 if(n.length<6){toast('新密码至少6位',true);return}
 if(n!==n2){toast('两次新密码不一致',true);return}
 const {error:ve}=await sb.auth.signInWithPassword({email:me.email,password:o});
 if(ve){toast('当前密码错误',true);return}
 const {error}=await sb.auth.updateUser({password:n});
 if(error){toast('修改失败',true);return}
 audit('修改密码',me.userName,null);closeModal();toast('密码已修改');
}

/* ---- 行映射 ---- */
const mapEmployee=x=>({id:x.id,name:x.name,team:x.team,role:x.role||'',active:x.active});
const mapProduct=x=>({id:x.id,model:x.model,style:x.style,process:x.process,price:Number(x.price)});
const mapRecord=x=>({id:x.id,date:x.work_date,empId:x.emp_id,model:x.model,style:x.style,process:x.process,qtyGood:x.qty_good,qtyBad:x.qty_bad,note:x.note||'',createdBy:x.created_by});
const mapMaterial=x=>({id:x.id,date:x.work_date,name:x.name,spec:x.spec||'',unit:x.unit||'',qty:Number(x.qty),price:Number(x.price),person:x.person||'',note:x.note||''});

/* ---- 数据加载（按表，一次到位）---- */
function setCloud(t){const el=$('#cloudStatus');if(el)el.textContent=t}
async function loadAllData(silent){
 if(!silent)setCloud('☁️ 数据加载中...');
 const [em,pr,re,tw,ma]=await Promise.all([
  sb.from('employees').select('*').order('id'),
  sb.from('products').select('*').order('id'),
  sb.from('records').select('*').order('id'),
  sb.from('time_wages').select('*'),
  sb.from('materials').select('*').order('id')
 ]);
 if(em.error)throw em.error;if(pr.error)throw pr.error;if(re.error)throw re.error;
 DB.employees=em.data.map(mapEmployee);
 DB.products=pr.data.map(mapProduct);
 DB.records=re.data.map(mapRecord);
 DB.materials=ma.data.map(mapMaterial);
 DB.timeWages={};tw.data.forEach(x=>DB.timeWages[x.id]=Number(x.amount));
 dataReady=true;if(!silent)setCloud('☁️ 已连接 · 实时同步');
}

/* ---- 行级 CRUD ---- */
async function createRecord(o){
 const {data,error}=await sb.from('records').insert({work_date:o.date,emp_id:o.empId,model:o.model,style:o.style,process:o.process,qty_good:o.qtyGood,qty_bad:o.qtyBad,note:o.note}).select('*').single();
 if(error)throw error;return mapRecord(data);
}
async function updateRecord(id,o){
 const {data,error}=await sb.from('records').update({work_date:o.date,emp_id:o.empId,model:o.model,style:o.style,process:o.process,qty_good:o.qtyGood,qty_bad:o.qtyBad,note:o.note}).eq('id',id).select('*').single();
 if(error)throw error;return mapRecord(data);
}
async function deleteRecord(id){const {error}=await sb.from('records').delete().eq('id',id);if(error)throw error}

/* ---- 实时同步：任何人增改，所有客户端即时刷新 ---- */
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}
function onRowChange(kind,p){
 try{
  if(kind==='records'){
   if(p.eventType==='DELETE')DB.records=DB.records.filter(x=>x.id!==p.old.id);
   else upsert(DB.records,mapRecord(p.new));
  }else if(kind==='employees'){
   if(p.eventType==='DELETE')DB.employees=DB.employees.filter(x=>x.id!==p.old.id);
   else upsert(DB.employees,mapEmployee(p.new));
  }else if(kind==='products'){
   if(p.eventType==='DELETE')DB.products=DB.products.filter(x=>x.id!==p.old.id);
   else upsert(DB.products,mapProduct(p.new));
  }else if(kind==='materials'){
   if(p.eventType==='DELETE')DB.materials=DB.materials.filter(x=>x.id!==p.old.id);
   else upsert(DB.materials,mapMaterial(p.new));
  }else if(kind==='time_wages'){
   if(p.eventType==='DELETE')delete DB.timeWages[p.old.id];else DB.timeWages[p.new.id]=Number(p.new.amount);
  }
 }catch(e){}
 safeRender();
}
function subscribeRealtime(){
 const ch=sb.channel('db-changes');
 ['records','employees','products','materials','time_wages'].forEach(t=>
  ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>onRowChange(t,p)));
 ch.subscribe();
}

let curView='dashboard';
async function afterAuth(session){
 const user=session.user;
 me={id:user.id,email:user.email,userName:user.email.split('@')[0]};
 isAdmin=roleOf(user)==='admin';
 document.body.classList.toggle('role-admin',isAdmin);
 $('#loginPage').style.display='none';$('#appRoot').style.display='block';
 try{
  if(!dataReady)await loadAllData();
  subscribeRealtime();
  /* 兜底：Realtime 若未覆盖某表，每25秒静默轮询；切回本标签立即刷新，保证多人录入近实时可见 */
  setInterval(async()=>{try{await loadAllData(true);safeRender()}catch(e){}},25000);
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){try{await loadAllData(true);safeRender()}catch(e){}}});
  $('#todayPill').textContent='今天：'+today();
  navigate('dashboard');
  audit('登录',me.userName,null);
 }catch(e){toast('数据加载失败：'+e.message,true)}
}

 sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefresh:true,detectSessionInUrl:false}});

 sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
 if(session)await afterAuth(session);
 else{$('#loginPage').style.display='flex';$('#loginUser').focus()}
}

function calcRow(div){
 const m=$('.e-model',div).value,s=$('.e-style',div).value,p=$('.e-proc',div).value;
 const g=+$('.e-qtygood',div).value||0;
 $('.e-wage',div).textContent='¥'+fmtMoney(g*(p?priceOf(m,s,p):0));
}
async function saveEntries(){
 const date=$('#entryDate').value;
 if(!date){toast('请选日期',true);return}
 const shift=$('#entryShift').value.trim();
 const rows=$$('#entryRows .entry-row');
 let ok=0,fail=0;
 for(const r of rows){
  const emp=$('.e-emp',r).value,model=$('.e-model',r).value,style=$('.e-style',r).value,proc=$('.e-proc',r).value;
  const g=+$('.e-qtygood',r).value||0,b=+$('.e-qtybad',r).value||0;
  let note=$('.e-note',r).value.trim();
  if(shift)note=(shift+(note?' / '+note:''));
  if(!model||!style||!proc){fail++;continue}
  try{await createRecord({date,empId:emp,model,style,process:proc,qtyGood:g,qtyBad:b,note});ok++}
  catch(e){fail++}
 }
 if(!ok){toast('没有有效行，请检查产品/款式/工序',true);return}
 audit('录入生产记录',date,{成功:ok,失败:fail});
 toast(`已保存 ${ok} 条${fail?'，'+fail+' 条未保存':''}`);
 $('#entryRows').innerHTML='';addEntryRow();
}

function getFilteredRecords(){
 const d=$('#filterDate').value,e=$('#filterEmp').value,k=($('#filterKw').value||'').trim().toLowerCase();
 let r=DB.records.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 if(d)r=r.filter(x=>x.date===d);
 if(e)r=r.filter(x=>x.empId===e);
 if(k)r=r.filter(x=>(x.model+x.style+x.process+(x.note||'')).toLowerCase().includes(k));
 return r;
}
function renderRecordsApply(){
 const r=getFilteredRecords();
 const totalPages=Math.max(1,Math.ceil(r.length/REC_PAGE_SIZE));
 if(recPage>totalPages)recPage=totalPages;
 const start=(recPage-1)*REC_PAGE_SIZE,pageData=r.slice(start,start+REC_PAGE_SIZE);
 $('#recCount').textContent=`共 ${r.length} 条${r.length!==DB.records.length?'（筛选自 '+DB.records.length+' 条）':''}`;
 $('#recBody').innerHTML=pageData.map(x=>{
   const tot=x.qtyGood+x.qtyBad,rr=tot>0?x.qtyGood/tot:1;
   const acts=canEdit(x)?`<button class="btn sm secondary" data-edit="${x.id}" style="margin-right:4px">改</button>${isAdmin?`<button class="btn sm danger" data-del="${x.id}">删</button>`:''}`:'<span style="color:var(--txt3);font-size:11px">仅查看</span>';
   return `<tr><td>${esc(x.date)}</td><td>${esc(empName(x.empId))}</td><td>${esc(x.model)}</td><td>${esc(x.style)}</td><td>${esc(x.process)}</td><td class="num">${x.qtyGood}</td><td class="num" style="${x.qtyBad>0?'color:var(--red)':''}">${x.qtyBad}</td><td><span class="badge ${rr<0.95?'red':'green'}">${(rr*100).toFixed(1)}%</span></td><td class="num" style="color:var(--accent);font-weight:600">${fmtMoney(wageOf(x))}</td><td style="color:var(--txt2);font-size:12px">${esc(x.note||'')}</td><td style="white-space:nowrap">${acts}</td></tr>`;
 }).join('')||'<tr><td colspan="11" class="empty">无匹配记录</td></tr>';
 $$('#recBody [data-edit]').forEach(b=>b.addEventListener('click',()=>editRecord(+b.dataset.edit)));
 $$('#recBody [data-del]').forEach(b=>b.addEventListener('click',()=>delRecord(+b.dataset.del)));
 $('#recPager').innerHTML=`<button class="btn sm secondary" id="pgPrev" ${recPage<=1?'disabled style="opacity:.4"':''}>上一页</button><span style="color:var(--txt2);font-size:12px">第 ${recPage} / ${totalPages} 页</span><button class="btn sm secondary" id="pgNext" ${recPage>=totalPages?'disabled style="opacity:.4"':''}>下一页</button>`;
 const pv=$('#pgPrev'),nx=$('#pgNext');
 if(pv&&recPage>1)pv.addEventListener('click',()=>{recPage--;renderRecordsApply()});
 if(nx&&recPage<totalPages)nx.addEventListener('click',()=>{recPage++;renderRecordsApply()});
}

function updatePayroll(){
 const d=$('#payDate').value,ym=$('#payMonth').value,ef=$('#payEmp').value;
 $('#dayTitle').textContent=`当日明细（${d}）`;
 const dayR=DB.records.filter(r=>r.date===d&&(!ef||r.empId===ef));
 let h='',tq=0,tw=0;
 DB.employees.forEach(e=>{
  if(ef&&e.id!==ef)return;
  const rs=dayR.filter(r=>r.empId===e.id),q=rs.reduce((s,r)=>s+(r.qtyGood||0),0),w=rs.reduce((s,r)=>s+wageOf(r),0);
  tq+=q;tw+=w;
  h+=`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td><span class="badge blue">${esc(e.team)}</span></td><td class="num">${q}</td><td class="num" style="color:var(--accent);font-weight:600">${fmtMoney(w)}</td><td>${rs.length}</td></tr>`;
 });
 if(tq>0)h+=`<tr style="font-weight:700;color:var(--red)"><td colspan="3">合计</td><td class="num">${tq}</td><td class="num">${fmtMoney(tw)}</td><td></td></tr>`;
 $('#dayBody').innerHTML=h||'<tr><td colspan="6" class="empty">当日无记录</td></tr>';
 const ms=monthStart(ym),mend=monthEnd(ym);
 $('#monthTitle').textContent=`月度累计（${ms} ~ ${mend}${ef?' · '+esc(empName(ef)):''}）`;
 const mr=DB.records.filter(r=>r.date>=ms&&r.date<=mend&&(!ef||r.empId===ef));
 const stats=DB.employees.filter(e=>!ef||e.id===ef).map(e=>{
  const rs=mr.filter(r=>r.empId===e.id),days=new Set(rs.map(r=>r.date)).size,q=rs.reduce((s,r)=>s+(r.qtyGood||0),0),w=rs.reduce((s,r)=>s+wageOf(r),0);
  return{...e,days,q,w,avg:days>0?w/days:0};
 }).sort((a,b)=>b.w-a.w);
 let mh=stats.map((s,i)=>`<tr><td>${esc(s.id)}</td><td style="font-weight:600">${esc(s.name)}</td><td><span class="badge blue">${esc(s.team)}</span></td><td class="num">${s.days}</td><td class="num">${s.q}</td><td class="num" style="color:var(--accent);font-weight:700;font-size:14px">${fmtMoney(s.w)}</td><td class="num">${fmtMoney(s.avg)}</td><td class="num"><span class="badge ${i<3?'yellow':'blue'}">第${i+1}名</span></td></tr>`).join('');
 const sq=stats.reduce((s,x)=>s+x.q,0),sw=stats.reduce((s,x)=>s+x.w,0);
 if(stats.length)mh+=`<tr style="font-weight:700;color:var(--red);background:var(--bg3)"><td colspan="4">合计</td><td class="num">${sq}</td><td class="num" style="font-size:15px">${fmtMoney(sw)}</td><td colspan="2"></td></tr>`;
 $('#monthBody').innerHTML=mh||'<tr><td colspan="8" class="empty">该月无记录</td></tr>';
}
async function exportMonthSummary(){
 try{
  if(typeof ExcelJS==='undefined'){toast('Excel 组件未加载',true);return}
  toast('生成中...');
  const ym=$('#payMonth').value,ms=monthStart(ym),mend=monthEnd(ym);
  const mr=DB.records.filter(r=>r.date>=ms&&r.date<=mend);
  const stats=DB.employees.map(e=>{
   const rs=mr.filter(r=>r.empId===e.id),days=new Set(rs.map(r=>r.date)).size,q=rs.reduce((s,r)=>s+(r.qtyGood||0),0),w=rs.reduce((s,r)=>s+wageOf(r),0);
   return{...e,days,q,w};
  }).sort((a,b)=>b.w-a.w);
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('月度汇总');
  ws.columns=[{width:8},{width:12},{width:10},{width:10},{width:12},{width:14}];
  ws.mergeCells(1,1,1,6);ws.getCell(1,1).value=ym.replace('-','年')+'月 工资汇总表';
  ws.getCell(1,1).font={size:16,bold:true,color:{argb:'FFFFFFFF'}};
  ws.getCell(1,1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1B3A5C'}};
  ws.getCell(1,1).alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=36;
  ['工号','姓名','班组','出勤天数','产量','工资'].forEach((hh,i)=>{
   const c=ws.getCell(2,i+1);c.value=hh;c.font={bold:true,color:{argb:'FFFFFFFF'}};
   c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2C5282'}};c.alignment={horizontal:'center'};
  });
  stats.forEach((s,i)=>{
   ws.getCell(3+i,1).value=s.id;ws.getCell(3+i,2).value=s.name;ws.getCell(3+i,3).value=s.team;
   ws.getCell(3+i,4).value=s.days;ws.getCell(3+i,5).value=s.q;
   ws.getCell(3+i,6).value=+s.w.toFixed(2);ws.getCell(3+i,6).numFmt='¥#,##0.00';
   if(i%2===1)for(let c=1;c<=6;c++)ws.getCell(3+i,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F9FC'}};
  });
  const tr=3+stats.length;
  ws.getCell(tr,1).value='合计';ws.mergeCells(tr,1,tr,3);
  ws.getCell(tr,4).value=stats.reduce((s,x)=>s+x.days,0);
  ws.getCell(tr,5).value=stats.reduce((s,x)=>s+x.q,0);
  ws.getCell(tr,6).value=+stats.reduce((s,x)=>s+x.w,0).toFixed(2);ws.getCell(tr,6).numFmt='¥#,##0.00';
  for(let c=1;c<=6;c++){ws.getCell(tr,c).font={bold:true,color:{argb:'FFFFFFFF'}};ws.getCell(tr,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1B3A5C'}}};
  const buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf]),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`月度汇总_${ym}.xlsx`;a.click();
  audit('导出月度汇总',ym,null);toast('已导出');
 }catch(e){toast('导出失败',true)}
}

function renderPaysheetData(){
 const ym=$('#sheetMonth').value||today().slice(0,7);
 const ms=monthStart(ym),dim=+monthEnd(ym).slice(8);
 const records=DB.records.filter(r=>r.date>=ms&&r.date<=monthEnd(ym));
 let html=`<thead><tr><th class="emp-col">工号</th><th class="emp-col">姓名</th>`;
 for(let d=1;d<=dim;d++)html+=`<th class="num" style="min-width:52px">${d}日</th>`;
 html+=`<th class="num sum-col">计件合计</th><th style="min-width:100px;text-align:center">计时工资</th><th class="num total-col">应发总工资</th></tr></thead><tbody>`;
 let gp=0,gt=0,gtot=0;
 DB.employees.forEach(e=>{
  const er=records.filter(r=>r.empId===e.id);let ps=0;
  html+=`<tr><td class="emp-col">${esc(e.id)}</td><td class="emp-col" style="font-weight:600">${esc(e.name)}</td>`;
  for(let d=1;d<=dim;d++){
   const ds=ym+'-'+pad2(d),dw=er.filter(r=>r.date===ds).reduce((s,r)=>s+wageOf(r),0);
   ps+=dw;
   html+=`<td class="num day-cell" style="${dw>0?'color:var(--txt);font-weight:500':'color:#475569'}">${dw>0?dw.toFixed(0):'·'}</td>`;
  }
  const key=ym+'_'+e.id,tw=DB.timeWages[key]||0,tot=ps+tw;
  gp+=ps;gt+=tw;gtot+=tot;
  html+=`<td class="num sum-col">${fmtMoney(ps)}</td><td class="num"><input class="time-wage" data-ym="${esc(ym)}" data-emp="${esc(e.id)}" type="number" step="0.01" min="0" value="${tw||''}" placeholder="0.00"></td><td class="num total-col">${fmtMoney(tot)}</td></tr>`;
 });
 html+=`<tr style="font-weight:700;background:var(--bg3)"><td class="emp-col" colspan="2">全厂合计</td>`;
 for(let d=1;d<=dim;d++){
  const ds=ym+'-'+pad2(d),dt=records.filter(r=>r.date===ds).reduce((s,r)=>s+wageOf(r),0);
  html+=`<td class="num" style="font-size:11px;color:var(--txt2)">${dt>0?dt.toFixed(0):'·'}</td>`;
 }
 html+=`<td class="num sum-col">${fmtMoney(gp)}</td><td class="num" style="text-align:center;color:var(--yellow)">${fmtMoney(gt)}</td><td class="num total-col">${fmtMoney(gtot)}</td></tr></tbody>`;
 $('#paysheetTable').innerHTML=html;
 $$('.time-wage').forEach(inp=>inp.addEventListener('change',async ev=>{
  const t=ev.target,ym=t.dataset.ym,emp=t.dataset.emp,val=parseFloat(t.value)||0;
  try{
   await saveTimeWage(ym,emp,val);
   const row=t.closest('tr'),piece=parseFloat(row.querySelector('.sum-col').textContent)||0;
   row.querySelector('.total-col').textContent=fmtMoney(piece+val);
   toast('计时工资已更新');
  }catch(e){toast('保存失败',true)}
 }));
}

/* ===== 批量导入（行级批量写入）===== */
async function bulkInsert(table,rows){
 for(let i=0;i<rows.length;i+=100){
  const {error}=await sb.from(table).insert(rows.slice(i,i+100));
  if(error)throw error;
 }
}
const IMPORT_TPL={
 employees:{title:'批量导入员工',hint:'从 Excel 选 4 列（工号、姓名、班组、岗位）复制后粘贴；首行表头自动忽略。',
  parse:p=>{const id=(p[0]||'').trim(),name=(p[1]||'').trim();if(!id||!name)return null;return{id,name,team:(p[2]||'一班').trim(),role:(p[3]||'').trim()}},
  commit:async l=>{const ex=new Set(DB.employees.map(e=>e.id));const rows=l.filter(o=>!ex.has(o.id)).map(o=>({id:o.id,name:o.name,team:o.team||'一班',role:o.role||'',active:true}));await bulkInsert('employees',rows);return rows.length}},
 products:{title:'批量导入工价',hint:'从 Excel 选 4 列（产品、款式、工序、工价）粘贴。',
  parse:p=>{const m=(p[0]||'').trim(),s=(p[1]||'').trim(),pr=(p[2]||'').trim(),price=parseFloat(p[3]);if(!m||!s||!pr||isNaN(price))return null;return{model:m,style:s,process:pr,price}},
  commit:async l=>{const ex=new Set(DB.products.map(p=>p.model+'|'+p.style+'|'+p.process));const rows=l.filter(o=>!ex.has(o.model+'|'+o.style+'|'+o.process)).map(o=>({model:o.model,style:o.style,process:o.process,price:o.price}));await bulkInsert('products',rows);return rows.length}},
 records:{title:'批量导入历史记录',hint:'7 列：日期、工号、产品、款式、工序、合格数、不良数。',
  parse:p=>{const d=(p[0]||'').trim(),id=(p[1]||'').trim(),m=(p[2]||'').trim(),s=(p[3]||'').trim(),pr=(p[4]||'').trim(),g=parseInt(p[5])||0,b=parseInt(p[6])||0;if(!d||!id||!m||!pr)return null;return{date:d,empId:id,model:m,style:s,process:pr,qtyGood:g,qtyBad:b,note:''}},
  commit:async l=>{const k=r=>[r.date,r.empId,r.model,r.style,r.process,r.qtyGood,r.qtyBad].join('|');const ex=new Set(DB.records.map(k));const rows=l.filter(o=>!ex.has(k(o))).map(o=>({work_date:o.date,emp_id:o.empId,model:o.model,style:o.style,process:o.process,qty_good:o.qtyGood,qty_bad:o.qtyBad,note:o.note||''}));await bulkInsert('records',rows);return rows.length}}
};
function openBulkImport(type){
 const cfg=IMPORT_TPL[type];
 modal(`<h3>${cfg.title}</h3><div class="tip">${cfg.hint}</div><label>粘贴区域：</label><textarea id="bulkText" rows="8" style="width:100%;font-family:monospace;font-size:12px"></textarea>
 <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" id="bulkGo">解析并导入</button></div>`);
 $('#bulkGo').addEventListener('click',()=>doBulkImport(type));
}
async function doBulkImport(type){
 const cfg=IMPORT_TPL[type],text=$('#bulkText').value.trim();
 if(!text){toast('请先粘贴',true);return}
 const lines=text.split(/\r?\n/).filter(l=>l.trim()),list=[],skips=[];
 lines.forEach((line,i)=>{
  const parts=line.split(/\t|,|，/);
  if(i===0&&/工号|姓名|产品|日期/.test(parts[0]))return;
  const o=cfg.parse(parts);if(o)list.push(o);else skips.push(i+1);
 });
 if(!list.length){toast('无有效数据',true);return}
 try{
  const n=await cfg.commit(list);
  audit('批量导入',type,{导入:n,跳过:skips.length});
  closeModal();toast(`导入 ${n} 条${skips.length?'，跳过 '+skips.length:''}`);
 }catch(e){toast('导入失败：'+e.message,true)}
}

 const rd=new FileReader();
 rd.onload=async()=>{
  try{
   const p=JSON.parse(rd.result);
   const replace=confirm('导入方式：\n\n【确定】合并导入：保留现有数据，只增补备份中的新内容（推荐，安全）\n【取消】完全替换：先清空现有数据，再按备份恢复');
   if(!replace)await doClearTables();
   let nEmp=0,nProd=0,nRec=0,nMat=0;
   if(Array.isArray(p.employees)){
    const ex=new Set(DB.employees.map(x=>x.id));
    const rows=p.employees.filter(o=>o&&o.id&&!ex.has(o.id)).map(o=>({id:o.id,name:o.name,team:o.team||'一班',role:o.role||'',active:true}));
    await bulkInsert('employees',rows);nEmp=rows.length;
   }
   if(Array.isArray(p.products)){
    const ex=new Set(DB.products.map(x=>x.model+'|'+x.style+'|'+x.process));
    const rows=p.products.filter(o=>o&&o.model&&!ex.has(o.model+'|'+o.style+'|'+o.process)).map(o=>({model:o.model,style:o.style,process:o.process,price:+o.price||0}));
    await bulkInsert('products',rows);nProd=rows.length;
   }
   if(Array.isArray(p.records)){
    const k=r=>[r.date,r.empId,r.model,r.style,r.process,r.qtyGood,r.qtyBad].join('|');
    const ex=new Set(DB.records.map(k));
    const rows=p.records.filter(o=>o&&o.date&&o.empId&&!ex.has(k({date:o.date,empId:o.empId,model:o.model,style:o.style,process:o.process,qtyGood:o.qtyGood,qtyBad:o.qtyBad})))
     .map(o=>({work_date:o.date,emp_id:o.empId,model:o.model,style:o.style,process:o.process,qty_good:+o.qtyGood||0,qty_bad:+o.qtyBad||0,note:o.note||''}));
    await bulkInsert('records',rows);nRec=rows.length;
   }
   if(Array.isArray(p.materials)){
    const ex=new Set(DB.materials.map(m=>m.date+'|'+m.name));
    const rows=p.materials.filter(o=>o&&o.name&&!ex.has(o.date+'|'+o.name)).map(o=>({work_date:o.date,name:o.name,spec:o.spec||'',unit:o.unit||'',qty:+o.qty||0,price:+o.price||0,person:o.person||''}));
    await bulkInsert('materials',rows);nMat=rows.length;
   }
   if(p.timeWages&&typeof p.timeWages==='object'){
    const rows=Object.entries(p.timeWages).filter(([id,amt])=>amt).map(([id,amt])=>{const[ym,emp]=id.split('_');return{id,ym,emp_id:emp,amount:+amt||0}});
    if(rows.length){const{error}=await sb.from('time_wages').upsert(rows,{onConflict:'id'});if(error)throw error}
   }
   await loadAllData();render();
   audit(replace?'合并导入备份':'替换导入备份',f.name,{员工:nEmp,工价:nProd,记录:nRec,物料:nMat});
   toast(`导入完成：员工${nEmp}、工价${nProd}、记录${nRec}、物料${nMat}`);
  }catch(err){toast('导入失败：'+err.message,true)}
 };
 rd.readAsText(f);e.target.value='';
}

loadAll();
